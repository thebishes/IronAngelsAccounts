version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - server/.env
    environment:
      - NODE_ENV=production
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - API_HOST=backend
      - API_PORT=3001
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
